# The universe, and the two hand-maintained dicts that hang off it.
#
# This file exists in week one rather than at Stage 6, for one reason: **the
# GDELT cache is keyed by symbol**, and GDELT's open API serves only a rolling
# ~3-month window. Whatever is not on this list from week one has no sentiment
# history at Stage 8, and no amount of later effort recovers it.
#
# So err WIDE. Caching a symbol you never trade costs a few API calls a day;
# adding one later costs three months of unrecoverable history.

benchmark: SPY # Similar: [QQQ, VOO, IVV, VTI, DIA] | Alternatives: [QQQM, VUG, VGT, ONEQ, QQEW]

# ---------------------------------------------------------------------------
# gdelt_query
# ---------------------------------------------------------------------------
# GDELT matches TEXT, not tickers. A naive query for `META` returns metaphysics,
# and `AAPL` returns nothing at all. These are a starting point, NOT verified.
#
#   Run `python scripts/gdelt_collect.py --inspect SYMBOL` and read the returned
#   headlines for each symbol ONCE. Get this wrong and the tone series is
#   measuring something else entirely -- which is worse than having no tone
#   series, because it looks like data.
#
# The trade-off in each query is recall vs contamination. "Apple" alone pulls in
# fruit and record labels; "Apple Inc" alone is precise but sparse, and most
# outlets do not write "Inc". Prefer a couple of unambiguous product or
# executive terms OR'd together over either extreme.
#
# ---------------------------------------------------------------------------
# sector_etf
# ---------------------------------------------------------------------------
# For the relative-strength metric (architecture §7.1): absolute return tells you
# almost nothing in a trending market. Free sector classification is poor, so a
# hand-maintained dict for a small universe is 12 lines and honest.

symbols:

  - symbol: SPY
    name: "SPDR S&P 500 ETF Trust"
    sector_etf: null              # it IS the benchmark
    gdelt_query: '("S&P 500" OR "stock market")'
    # An ETF has no EDGAR companyfacts. This is the case where a naive
    # fundamentals path throws -- exercise it at the Stage 2 exit gate.
    has_fundamentals: false

  - symbol: AAPL
    name: "Apple Inc."
    sector_etf: XLK
    gdelt_query: '("Apple Inc" OR "Apple iPhone" OR "Tim Cook")'

  - symbol: MSFT
    name: "Microsoft Corporation"
    sector_etf: XLK
    gdelt_query: '(Microsoft OR "Satya Nadella")'

  - symbol: NVDA
    name: "NVIDIA Corporation"
    sector_etf: XLK
    gdelt_query: '(Nvidia OR "Jensen Huang")'

  - symbol: AVGO
    name: "Broadcom Inc."
    sector_etf: XLK
    gdelt_query: '(Broadcom OR "Hock Tan")'

  - symbol: AMZN
    name: "Amazon.com, Inc."
    sector_etf: XLY
    gdelt_query: '("Amazon.com" OR "Amazon Web Services" OR "Andy Jassy")'
    # "Amazon" bare would collect rainforest coverage, which is exactly the
    # failure this column exists to prevent.

  - symbol: GOOGL
    name: "Alphabet Inc."
    sector_etf: XLC
    gdelt_query: '("Alphabet Inc" OR Google OR "Sundar Pichai")'

  - symbol: META
    name: "Meta Platforms, Inc."
    sector_etf: XLC
    gdelt_query: '("Meta Platforms" OR Instagram OR "Mark Zuckerberg")'
    # The canonical trap. Bare `Meta` returns metaphysics, and bare `Facebook`
    # returns platform-usage stories rather than company coverage. Worth
    # eyeballing this one first.

  - symbol: JPM
    name: "JPMorgan Chase & Co."
    sector_etf: XLF
    gdelt_query: '(JPMorgan OR "Jamie Dimon")'

  - symbol: XOM
    name: "Exxon Mobil Corporation"
    sector_etf: XLE
    gdelt_query: '("Exxon Mobil" OR ExxonMobil OR Exxon)'

  - symbol: UNH
    name: "UnitedHealth Group Incorporated"
    sector_etf: XLV
    gdelt_query: '("UnitedHealth" OR "UnitedHealthcare")'

  - symbol: JNJ
    name: "Johnson & Johnson"
    sector_etf: XLV
    gdelt_query: '("Johnson & Johnson" OR "Johnson and Johnson")'

  # ---------------------------------------------------------------------------
  # Added because they appear as theme exemplars in portfolio-intent.yaml.
  # An exemplar with no universe entry collects no sentiment, and the GDELT
  # window is ~3 months -- so the gap would have been silent and permanent.
  # tests/test_config.py now asserts every exemplar is listed here.
  # ---------------------------------------------------------------------------

  - symbol: MRVL
    name: "Marvell Technology, Inc."
    sector_etf: XLK
    gdelt_query: '("Marvell Technology" OR "Marvell Semiconductor")'
    # Bare "Marvell" collects Marvel Entertainment coverage -- one letter apart
    # and vastly more numerous. Both terms kept explicit for that reason.

  - symbol: TSM
    name: "Taiwan Semiconductor Manufacturing Company Limited"
    sector_etf: XLK
    gdelt_query: '("Taiwan Semiconductor" OR TSMC)'
    # ADR. It files 20-F, not 10-K, so the EDGAR companyfacts shape differs
    # from every other name here -- several us-gaap tags are absent and the
    # Piotroski F-score (§7.1) cannot be computed the same way. Expect the
    # fundamentals path to need a branch at Stage 2, and prefer an explicit
    # `None with a reason` over a silently partial score.
    files_20f: true

  - symbol: BRK.B
    name: "Berkshire Hathaway Inc. Class B"
    sector_etf: XLF
    gdelt_query: '("Berkshire Hathaway" OR "Warren Buffett")'
    # Share-class tickers are spelled differently by every provider, and the
    # failure mode is a silently EMPTY price series rather than an error.
    provider_symbols:
      stooq: "brk-b.us"
      ib: "BRK B"            # IB uses a space; SMART/USD
      yahoo: "BRK-B"
      edgar: "BRK-B"       # a THIRD spelling: EDGAR uses a dash
    # Financials screening does not transfer to a conglomerate holding company:
    # gross profitability and accruals (§7.1) are close to meaningless here,
    # and book/price is the metric that actually means something. Worth a
    # prompt caveat rather than pretending the usual quality stack applies.
    quality_metrics_apply: false

  # ------------------------------------------------------------------------
  # Added 2026-10-07, widening the universe from 15 to 32 collected symbols.
  #
  # TWO THINGS TO KNOW BEFORE EDITING ANY `gdelt_query` BELOW.
  #
  # 1. GDELT matches TEXT, NOT TICKERS. Four of these needed a hand-built
  #    query or they would have measured something else entirely: V (visa
  #    and immigration documents), CAT (cats, and the insect), TEM (tempus
  #    fugit), AMD (unrelated acronyms).
  #
  #    VERIFIED with `--inspect` on 2026-10-07: V (first attempt was badly
  #    contaminated and was rewritten -- see its comment) and CAT.
  #
  #    *** NOT YET VERIFIED: TEM and AMD. *** The GDELT API put this IP in a
  #    sustained throttle before they could be checked. Both use a specific
  #    multi-word phrase rather than the bare ticker, so the risk is lower
  #    than V's was -- but run these two before trusting their series, and
  #    fix the query BEFORE the first collection rather than after:
  #
  #        uv run python scripts/gdelt_collect.py --inspect TEM
  #        uv run python scripts/gdelt_collect.py --inspect AMD
  #
  # 2. A QUERY CANNOT BE CHANGED ONCE COLLECTED. collect_symbol() warns on a
  #    changed query because splicing two different measurements into one
  #    history is invisible downstream. Verify first, collect second.
  #
  # SHARED SERIES, DELIBERATELY. VOO and IVV track the same index as SPY,
  # ONEQ the same family as QQQ, and SMH the same industry as SOXX. They
  # therefore carry the SAME query and will hold near-identical tone series.
  # That is correct rather than lazy -- the same news genuinely moves them --
  # but it means a news analyst reading VOO sees SPY's tone, which is a fact
  # about the world and not a bug to fix.
  # ------------------------------------------------------------------------

  # --- Equities -----------------------------------------------------------

  - symbol: V
    name: "Visa Inc. Class A"
    sector_etf: XLF
    # NOT '(Visa)' -- bare "visa" is immigration and travel documents. And NOT
    # "Visa card" / "Visa payments" either, which was the first attempt and was
    # measured as badly contaminated: those phrases match every OTHER bank's
    # card launch (CIB Egypt, a Vegas credit union) plus outright noise -- one
    # --inspect returned seven copies of a United Way community-funding story.
    # Card marketing is not news about Visa Inc.
    #
    # Corporate terms only: the legal name and the CEO.
    # "Visa stock" / "Visa earnings" are safe to add: neither phrase occurs in
    # immigration coverage, and the legal name alone was too sparse to give a
    # stable tone percentile.
    gdelt_query: '("Visa Inc" OR "Visa stock" OR "Visa earnings" OR "Ryan McInerney")'

  - symbol: MA
    name: "Mastercard Incorporated Class A"
    sector_etf: XLF
    # Query the company name, never the ticker: "MA" is Massachusetts, and a
    # hundred other things.
    gdelt_query: '(Mastercard)'

  - symbol: PLTR
    name: "Palantir Technologies Inc. Class A"
    sector_etf: XLK
    gdelt_query: '(Palantir OR "Alex Karp")'

  - symbol: AMD
    name: "Advanced Micro Devices, Inc."
    sector_etf: XLK
    # "AMD" alone also matches age-related macular degeneration, among
    # others. The full name plus the CEO is specific.
    gdelt_query: '("Advanced Micro Devices" OR "Lisa Su")'

  - symbol: FSLR
    name: "First Solar, Inc."
    # GICS puts First Solar in Information Technology (semiconductors and
    # semiconductor equipment), not Energy -- it manufactures thin-film
    # panels. XLK is the right relative-strength comparison.
    sector_etf: XLK
    gdelt_query: '("First Solar")'

  - symbol: LLY
    name: "Eli Lilly and Company"
    sector_etf: XLV
    gdelt_query: '("Eli Lilly" OR Zepbound OR Mounjaro)'

  - symbol: TEM
    name: "Tempus AI, Inc."
    # Health-care diagnostics built on AI, so XLV rather than XLK: its
    # revenue is clinical, and that is what the relative-strength metric
    # should measure it against.
    sector_etf: XLV
    # NOT '(Tempus)'. That matches tempus fugit, several magazines and a
    # watch brand.
    gdelt_query: '("Tempus AI")'

  - symbol: HON
    name: "Honeywell International Inc."
    sector_etf: XLI
    gdelt_query: '(Honeywell)'

  - symbol: CAT
    name: "Caterpillar Inc."
    sector_etf: XLI
    # NOT '(CAT)' and not bare '(Caterpillar)'. The ticker is a household
    # pet and the name is an insect; both flood the result set.
    # Measured with --inspect: this returns mostly Caterpillar coverage (stock
    # moves, an institutional sale, a $1bn plant investment) with some
    # industrials-sector spillover, which is acceptable. "Caterpillar stock" is
    # added for volume -- at 7 articles a day the tone percentile was too thin
    # to be stable, and that phrase cannot mean the insect.
    gdelt_query: '("Caterpillar Inc" OR "Caterpillar stock" OR "Caterpillar earnings")'

  - symbol: SPCX
    name: "Space Exploration Technologies Corp."
    # Aerospace and defence. Confirmed against EDGAR's ticker map as
    # SPACE EXPLORATION TECHNOLOGIES CORP -- worth stating because the same
    # ticker previously belonged to an unrelated SPAC ETF.
    sector_etf: XLI
    gdelt_query: '(SpaceX OR "Space Exploration Technologies")'
    # Recently listed, so the 5-year bar request returns a short series and
    # the 12-month momentum and 52-week range metrics will be unavailable
    # WITH A REASON. That is the designed behaviour, not a failure.

  # --- ETFs ---------------------------------------------------------------
  # No EDGAR companyfacts, like SPY. Sector ETFs are supporting series only,
  # but these are tradeable members of the book, so they are full entries.

  - symbol: QQQ
    name: "Invesco QQQ Trust Series 1"
    # A broad-index fund is not SECTOR exposure, so max_sector_pct cannot
    # apply to it. See the documented exemption in tests/intent/test_engine.py.
    sector_etf: null
    gdelt_query: '("Nasdaq 100" OR "Nasdaq composite" OR "tech stocks")'
    has_fundamentals: false

  - symbol: ONEQ
    name: "Fidelity Nasdaq Composite Index ETF"
    sector_etf: null
    # Same query as QQQ on purpose -- same index family, same news.
    gdelt_query: '("Nasdaq 100" OR "Nasdaq composite" OR "tech stocks")'
    has_fundamentals: false

  - symbol: VOO
    name: "Vanguard S&P 500 ETF"
    sector_etf: null
    # Same query as SPY on purpose -- same index, same news.
    gdelt_query: '("S&P 500" OR "stock market")'
    has_fundamentals: false

  - symbol: IVV
    name: "iShares Core S&P 500 ETF"
    sector_etf: null
    # Same query as SPY and VOO on purpose.
    gdelt_query: '("S&P 500" OR "stock market")'
    has_fundamentals: false

  - symbol: SOXX
    name: "iShares Semiconductor ETF"
    # XLK, deliberately. A semiconductor ETF IS tech exposure, so holding
    # NVDA + AVGO + SOXX now counts together toward max_sector_pct -- which
    # is exactly the hidden concentration that cap exists to catch.
    sector_etf: XLK
    gdelt_query: '("semiconductor industry" OR "chip stocks")'
    has_fundamentals: false

  - symbol: SMH
    name: "VanEck Semiconductor ETF"
    sector_etf: XLK
    # Same query as SOXX on purpose -- same industry, same news.
    gdelt_query: '("semiconductor industry" OR "chip stocks")'
    has_fundamentals: false

  - symbol: AIQ
    name: "Global X Artificial Intelligence & Technology ETF"
    sector_etf: XLK
    # Its own query: AI as an investment narrative is distinguishable from
    # the Nasdaq and from semiconductors, so this one is not a duplicate.
    gdelt_query: '("AI stocks" OR "artificial intelligence stocks")'
    has_fundamentals: false


# The eleven SPDR sector ETFs, for reference. Add a symbol's mapping above
# rather than inferring one at runtime.
sector_etfs:
  XLK:  "Technology"
  XLY:  "Consumer Discretionary"
  XLC:  "Communication Services"
  XLF:  "Financials"
  XLE:  "Energy"
  XLV:  "Health Care"
  XLP:  "Consumer Staples"
  XLI:  "Industrials"
  XLB:  "Materials"
  XLRE: "Real Estate"
  XLU:  "Utilities"
