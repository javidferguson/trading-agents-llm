# The research desk. Two services, plus an optional Langfuse stack.
#
# This file declares NO IB Gateway service. There is exactly one Gateway, it is
# owned by the ORB+GEX repo, and this repo joins its network. Two Gateway
# containers would mean two logins to the same IB account, which IB resolves by
# evicting one of them (migration plan §0).
#
#   `make gateway-start` is a command you run IN THAT REPO, not this one.
#
# Ollama is likewise absent by design. On macOS, Docker Desktop runs a Linux VM
# with no Metal passthrough, so a containerised Ollama is CPU-only with a
# fraction of your RAM -- roughly 5-15x slower than native. A 14-call pipeline
# that takes 4 minutes natively takes 40+ containerised, which is the difference
# between a tool you use and one you abandon (architecture §10). Run it natively
# and reach it via host.docker.internal. The `ollama` profile below exists only
# for a Linux/NVIDIA box and for CI.

name: research-desk

x-common: &common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  env_file: [../.env]
  working_dir: /app
  restart: "no"
  extra_hosts:
    # host.docker.internal is native on Docker Desktop; this line is what makes
    # the same compose file work on Linux.
    - "host.docker.internal:host-gateway"
  volumes:
    - ../data:/app/data
    - ../logs:/app/logs
    - ../config:/app/config:ro
    - ../prompts:/app/prompts:ro

services:

  # ---------------------------------------------------------------------------
  # decide -- agents, LLM, free data. No IB connection, no ib_async installed.
  # ---------------------------------------------------------------------------
  decide:
    <<: *common
    container_name: desk-decide
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        EXTRAS: ""          # deliberately empty: no ib_async in this image
    environment:
      # The gotcha that costs an hour: Ollama binds 127.0.0.1:11434 by default
      # and a container cannot reach it. Set OLLAMA_HOST=0.0.0.0:11434 on the
      # HOST daemon, then verify with `make check-ollama`, which curls from
      # inside this container rather than from your shell.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
    command: ["desk", "doctor"]

  # ---------------------------------------------------------------------------
  # dev -- THE DEFAULT DEVELOPMENT ENTRY POINT.  `make shell`
  #
  # Source is bind-mounted, so edits take effect with no rebuild. That is the
  # whole point: the first time this was tried against a COPY-only image, the
  # container ran a version of the code from before the script under test
  # existed, and the error ("can't open file") said nothing about staleness.
  #
  # It carries dev dependencies AND the ib_async extra, so one shell runs the
  # test suite, `desk snapshot` and `make bars`. That does mean this image
  # cannot enforce the §0 split by its contents the way `decide` does -- which
  # is fine, because the split is enforced where it actually matters:
  # tests/test_layering.py reads the import graph, and asserts in a subprocess
  # that ib_async is absent from decide's dependency tree.
  #
  # NOT a production artefact. `decide` and `execute` are.
  # ---------------------------------------------------------------------------
  dev:
    <<: *common
    container_name: desk-dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        EXTRAS: "execute"
        DEV_GROUP: ""        # install the dev group: pytest et al
    stdin_open: true
    tty: true
    environment:
      # Ollama runs NATIVELY on the host for Metal (§10: containerised on
      # macOS is 5-15x slower, CPU-only inside a VM with no Metal passthrough).
      #
      # MEASURED, and it corrects §10: on current Docker Desktop for Mac this
      # works with Ollama bound to 127.0.0.1 -- host.docker.internal is
      # proxied to the host loopback, so the daemon needs NO reconfiguration.
      # §10 says a container cannot reach a 127.0.0.1 bind; that was true of
      # older Docker Desktop and is not true here.
      #
      # It IS still true on Linux, where host-gateway resolves to the host's
      # bridge address and a loopback-only service is unreachable. There:
      #
      #     OLLAMA_HOST=0.0.0.0:11434   # on the host daemon
      #
      # `make check-ollama` answers this from inside the container, which is
      # the only place the answer means anything.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_CONTAINER:-http://host.docker.internal:11434}
      # Service name, not localhost: langfuse-web is a sibling container.
      LANGFUSE_HOST: ${LANGFUSE_HOST_CONTAINER:-http://langfuse-web:3000}
      IB_HOST: ${IB_HOST:-desk-ib-gateway}
      IB_PORT: ${IB_PORT:-4004}
      IB_CLIENT_ID: ${IB_CLIENT_ID:-12}
      TZ: ${TZ:-America/New_York}
    volumes:
      # The repo over /app. Safe because the venv lives in /opt/venv -- see the
      # Dockerfile comment.
      - ../:/app
    networks: [default, trading-llm-network]
    command: ["bash"]

  # ---------------------------------------------------------------------------
  # execute -- human gate and ib_async. No LLM, no network beyond IB.
  # ---------------------------------------------------------------------------
  execute:
    <<: *common
    container_name: desk-execute
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        EXTRAS: "execute"
    # Interactive: the confirmation gate reads stdin, and a closed stdin must
    # decline rather than proceed. `docker compose run --rm execute ...`.
    stdin_open: true
    tty: true
    # NOTE THE ASYMMETRY WITH `dev`, AND IT IS DELIBERATE.
    #
    # `dev` bind-mounts the whole repo at /app, so source edits take
    # effect with no rebuild. This service mounts only data/, logs/,
    # config/ and prompts/ -- NOT src/ -- so the process that places
    # real orders runs built code rather than whatever happens to be
    # in the working tree.
    #
    # The cost is that the image goes stale SILENTLY, so `make
    # execute` passes --build. Do not optimise that away: a stale
    # image runs an old broker.py against a current proposal and says
    # nothing. Stage 7 only caught it because the entry point was
    # missing outright and the container refused to start.
    environment:
      IB_HOST: ${IB_HOST:-desk-ib-gateway}
      # 4004 is socat-paper INSIDE the gateway container (see ib-gateway below).
      # From the host it is 4012.
      IB_PORT: ${IB_PORT:-4004}
      # 11 is the research desk's execute slot. ib_async connections that
      # collide on clientId do NOT error -- they silently fail to connect.
      IB_CLIENT_ID: ${IB_CLIENT_ID:-11}
      # Must match the exchange, or IB stamps bars in UTC.
      TZ: ${TZ:-America/New_York}
    depends_on:
      ib-gateway:
        condition: service_started
    networks: [default, trading-llm-network]
    profiles: [execute]     # Stage 7. Not started by `make up`.

  # ---------------------------------------------------------------------------
  # ib-gateway -- THIS PROJECT'S OWN Gateway. Not the ORB+GEX engine's.
  #
  # Reverses migration plan §0 ("One IB Gateway, two consumers"). Independence
  # beat sharing, but the reason §0 gave for sharing is real and does not go
  # away: ONE IB USERNAME SUPPORTS ONE GATEWAY SESSION. Running this at the
  # same time as the ORB engine's `ajj-ib-gateway` means two logins to one
  # account, and one of them loses.
  #
  #   >> NEVER RUN BOTH. `make gateway-start` refuses if the other is up. <<
  #
  # Most of what follows is carried from
  #   automated-trading-engine/docker/docker-compose-options-trader.yml
  # with its comments. Each line there cost real debugging; re-deriving them
  # here would be pure loss.
  # ---------------------------------------------------------------------------
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:latest
    container_name: desk-ib-gateway
    env_file: [../.env]
    environment:
      TWS_USERID: ${IB_USERNAME:-}
      TWS_PASSWORD: ${IB_PASSWORD:-}

      # Paper only. There is no live path in this project.
      TRADING_MODE: ${TRADING_MODE:-paper}

      # Without this the image writes TimeZone=Etc/UTC into jts.ini and IB
      # returns historical bar timestamps in UTC. The ORB engine lost a session
      # to this: bars stamped 13:30 matched nothing looking for 09:30.
      TIME_ZONE: ${TIME_ZONE:-America/New_York}

      # The image starts x11vnc ONLY when this is set. Unset, port 5900 is
      # published but nothing listens -- and you cannot see a login dialog that
      # is waiting for input, which is exactly when you need to.
      VNC_SERVER_PASSWORD: ${VNC_PASSWORD:-}

      IBC_HEADLESS: "true"
      READ_ONLY_API: "no"
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      TWOFA_TIMEOUT_ACTION: restart

      # THE DELIBERATE DIVERGENCE FROM THE ORB CONFIG, which uses `primary`.
      #
      # This is IBC's answer to IB's "Existing session detected" dialog.
      # `primary` means "take over" -- and taking over would silently kill a
      # running ORB trading session, mid-position, from a container you started
      # to do research. `secondary` means this Gateway steps aside and does not
      # start.
      #
      # Failing to start is recoverable in ten seconds. A half-killed trading
      # session is not. If you genuinely want this one to win, set it in .env
      # deliberately rather than changing the default here.
      EXISTING_SESSION_DETECTED_ACTION: ${EXISTING_SESSION_DETECTED_ACTION:-secondary}

    # -------------------------------------------------------------------------
    # PORTS -- read before "fixing" these numbers. They are correct.
    #
    # The gnzsnz image runs IB Gateway bound to CONTAINER-localhost on 4001
    # (live) / 4002 (paper). Those are NOT reachable from outside. The image
    # runs socat to relay:
    #
    #     container 4003  ->  gateway 4001  (live)
    #     container 4004  ->  gateway 4002  (paper)
    #
    # So anything connecting from outside must use the socat ports.
    #
    # HOST PORTS DIFFER FROM THE ORB ENGINE ON PURPOSE (it uses 4002 and 5900).
    # Distinct numbers mean you always know which Gateway you reached, and the
    # exclusivity guard can probe for the other one unambiguously.
    #
    #   execute container -> desk-ib-gateway:4004   (over trading-llm-network)
    #   your Mac          -> 127.0.0.1:4012
    # -------------------------------------------------------------------------
    ports:
      # The host port comes from .env so there is ONE source of truth: the same
      # IB_HOST_PORT drives this publish and config.resolve_ib_endpoint(). It
      # used to be hardcoded here and set again in .env, which is two places to
      # change and one to forget.
      - "127.0.0.1:${IB_HOST_PORT:-4012}:4004"   # paper API -> socat paper
      # Live (host 4011 -> socat live). Left commented deliberately: with
      # TRADING_MODE=paper nothing is behind it, but it becomes a LIVE API
      # endpoint the moment TRADING_MODE flips.
      # - "127.0.0.1:4011:4003"
      - "127.0.0.1:5912:5900"   # VNC

    restart: unless-stopped
    networks: [trading-llm-network]
    profiles: [execute]     # Stage 7. Not started by `make up`.

    # Two things this must NOT do:
    #   1. Use `nc` -- not installed in the gnzsnz image, so the check errors
    #      and the container is permanently "unhealthy".
    #   2. Probe 4004 -- that is socat, which listens from container start
    #      whether or not the Gateway is up, so it reports healthy while the
    #      Gateway is still sitting on the login screen.
    # Probe the Gateway's own port, with bash, which is present.
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/4002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # ollama -- Linux/NVIDIA and CI only. On macOS run it natively (§10).
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: desk-ollama
    ports: ["11434:11434"]
    volumes: ["../data/ollama:/root/.ollama"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # Otherwise the model unloads between nodes and you pay a multi-second
      # reload on every one of 14 calls.
      OLLAMA_KEEP_ALIVE: 30m
      # Otherwise the four-analyst fan-out silently serialises.
      OLLAMA_NUM_PARALLEL: 4
    profiles: [ollama]

networks:
  # OURS, created by this compose project. Named distinctly from the ORB+GEX
  # engine's `trading-network` so the two projects can never accidentally share
  # a bridge -- and so that a stale reference fails loudly instead of silently
  # attaching to the wrong stack.
  #
  # It used to be `external: true` pointing at the ORB engine's network, which
  # broke the moment that network was removed: `docker compose up execute`
  # failed on a missing external network rather than on anything to do with us.
  trading-llm-network:
    driver: bridge
    name: trading-llm-network
